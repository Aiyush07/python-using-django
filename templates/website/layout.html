{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Django Website{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
    <div class="page-wrapper">
        <header class="site-header">
            <div class="container header-inner">
                <a class="brand" href="{% url 'newApp:home' %}">Ayu</a>
                <nav class="site-nav">
                    <a href="{% url 'newApp:home' %}">Home</a>
                    <a href="{% url 'newApp:about' %}">About</a>
                    <a href="{% url 'newApp:contact' %}">Contact</a>
                </nav>
            </div>
        </header>
        <main class="page-content container">
            {% block content %}{% endblock %}
        </main>
        <footer class="site-footer container">
            <p>Beautiful shopping UI built for your Django store.</p>
            <small>&copy; {{ year|default:"2026" }} Ayu. All rights reserved.</small>
        </footer>
    </div>
</body>
</html>
